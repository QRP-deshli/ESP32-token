# Host tests of the desktop side (no hardware) on Linux, Windows and macOS.
name: desktop

on:
  # branches are covered by pull_request; push only runs on main (after a merge), so a PR is not tested twice
  push:
    branches: [main]
    paths: ["desktop/**", "pico-keys-sdk/src/fingerprint/**", "pico-keys-sdk/src/usb/serial/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "pico-keys-sdk/src/fingerprint/**", "pico-keys-sdk/src/usb/serial/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop/common/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python tests
        run: |
          python test_layout.py
          python test_serial_link.py
          python test_windows_serial.py
          python test_posix_serial.py
          python test_fpctl.py
          python test_bridge_e2e.py
          python test_scripts.py
      - name: C tests (firmware code)
        # gcc on Linux and Windows (MinGW on the runner image), clang as cc on macOS
        run: |
          SDK=../../../pico-keys-sdk/src
          CC=gcc; [ "$RUNNER_OS" = macOS ] && CC=cc
          $CC -I$SDK/fingerprint test_fp_core.c $SDK/fingerprint/fp_core.c $SDK/fingerprint/fp_proto.c -o t_fp && ./t_fp
          $CC -I$SDK/usb/serial test_serial_proto.c $SDK/usb/serial/serial_proto.c -o t_sp && ./t_sp

  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (Linux and macOS scripts)
        if: runner.os == 'Linux'
        run: shellcheck -x -S error desktop/linux/*.sh desktop/mac/*.sh desktop/mac/vhid/build.sh desktop/issues/create-issues.sh
      - name: bash 3.2 syntax (macOS scripts)
        if: runner.os == 'macOS'
        run: for f in desktop/mac/*.sh desktop/mac/vhid/build.sh; do /bin/bash -n "$f"; done
      - name: build the macOS virtual HID helper
        if: runner.os == 'macOS'
        run: desktop/mac/vhid/build.sh
      - name: PowerShell parse (Windows scripts)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem desktop/windows -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  windows-vhid:
    # the Windows virtual HID driver (needs the WDK, which the windows-2022 image ships) and its helper
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64     # the 32-bit MSBuild cannot load the WDK's InfVerif.dll
      - name: build the helper (MinGW)
        shell: bash
        working-directory: desktop/windows/vhid/helper
        run: gcc -O2 -Wall -Werror -o pico-vhid.exe pico-vhid.c -lsetupapi
      - name: build the driver (KMDF + VHF, test-signed)
        run: msbuild desktop/windows/vhid/driver/pico_vhf.vcxproj /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: pico-vhf-windows-x64
          path: |
            desktop/windows/vhid/driver/x64/Release/pico_vhf/
            desktop/windows/vhid/helper/pico-vhid.exe
